[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-cost-model"
version = "0.1.0"
description = "Research slice: spread, slippage, and square-root impact costs vs gross/net Sharpe on a synthetic signal."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M.Varun", email = "116015799+Mavarun@users.noreply.github.com" }]
dependencies = [
    "numpy",
    "pandas",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
